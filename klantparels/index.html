<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klantparels — DNSSEC CS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">

    <!-- Firebase Firestore via CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <!-- Config (aangemaakt door CI via GitHub Secrets, niet in git) -->
    <script src="config.js"></script>

    <style>
        :root {
            --bg:           #ffffff;
            --surface:      #f5f5f5;
            --text:         #333333;
            --text-muted:   #888888;
            --border:       #dddddd;
            --polaroid-bg:  #fefefe;
            --shadow:       rgba(0,0,0,0.12);
            --accent:       hsl(220, 80%, 55%);
        }

        [data-theme="dark"] {
            --bg:           #1a1a1a;
            --surface:      #252525;
            --text:         #f0f0f0;
            --text-muted:   #888888;
            --border:       #3a3a3a;
            --polaroid-bg:  #2a2a2a;
            --shadow:       rgba(0,0,0,0.4);
            --accent:       hsl(220, 75%, 65%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
        }

        /* ── Top bar ── */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--bg);
            border-bottom: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .topbar-left { display: flex; align-items: center; gap: 12px; }

        a.back-link {
            border: 2px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            text-decoration: none;
            transition: opacity 0.15s;
        }

        a.back-link:hover { opacity: 0.7; }

        .page-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .topbar-right { display: flex; align-items: center; gap: 8px; }

        .icon-btn {
            background: none;
            border: 2px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            transition: opacity 0.15s;
            white-space: nowrap;
        }

        .icon-btn:hover { opacity: 0.7; }

        /* ── Hero ── */
        .hero {
            text-align: center;
            padding: 48px 20px 32px;
        }

        .hero-emoji { font-size: 3rem; display: block; margin-bottom: 10px; }

        .hero h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 480px;
            margin: 0 auto 24px;
            line-height: 1.55;
        }

        .hero-add-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, hsl(220,80%,55%), hsl(270,75%,60%));
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(100,100,220,0.3);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .hero-add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(100,100,220,0.4);
        }

        /* ── Filter bar ── */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 20px;
            padding: 0 20px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-muted);
            white-space: nowrap;
            margin-right: 2px;
        }

        .chip {
            background: none;
            border: 1.5px solid var(--border);
            color: var(--text-muted);
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            white-space: nowrap;
            line-height: 1.5;
        }

        .chip:hover { border-color: var(--text); color: var(--text); }

        .chip.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
            font-weight: 600;
        }

        .filter-sep {
            width: 1px;
            height: 22px;
            background: var(--border);
            flex-shrink: 0;
        }

        .filter-count {
            font-size: 0.78rem;
            color: var(--text-muted);
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 4px 11px;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .filter-sep { display: none; }
            .filter-bar  { gap: 10px 14px; }
        }

        /* ── Masonry grid ── */
        .wall {
            columns: 280px;
            column-gap: 20px;
            padding: 0 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ── Polaroid card ── */
        .card {
            break-inside: avoid;
            margin-bottom: 20px;
            background: var(--polaroid-bg);
            border-radius: 4px;
            box-shadow: 0 4px 18px var(--shadow);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            animation: cardIn 0.4s ease both;
        }

        .card:hover {
            transform: translateY(-4px) rotate(0.3deg);
            box-shadow: 0 10px 28px var(--shadow);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Card with photo */
        .card.has-photo .photo-wrap {
            position: relative;
            padding-top: 75%;
            overflow: hidden;
        }

        .card.has-photo .photo-wrap img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 16px 16px 12px;
            border-top: 1px solid var(--border);
        }

        .card.has-photo .card-body {
            border-top: none;
            background: var(--polaroid-bg);
            padding: 14px 16px 12px;
        }

        /* ── Video card ── */
        .card.has-video .video-wrap {
            overflow: hidden;
            background: #000;
            max-height: 320px;
        }

        .card.has-video .video-wrap video {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .card.has-video .card-body {
            border-top: none;
            background: var(--polaroid-bg);
            padding: 14px 16px 12px;
        }


        /* Quote text */
        .card-quote {
            font-size: 0.92rem;
            line-height: 1.55;
            color: var(--text);
            margin-bottom: 10px;
            font-style: italic;
        }

        .card-quote::before { content: '\201C'; }
        .card-quote::after  { content: '\201D'; }

        /* Text-only cards — creative accent */
        .card.text-only {
            border-radius: 8px;
        }

        .card.text-only .card-body {
            border-top: none;
            padding: 20px 18px 14px;
        }

        .card.text-only .card-quote {
            font-size: 1rem;
            font-weight: 500;
        }

        /* Meta row */
        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .card-meta-left { display: flex; flex-direction: column; gap: 2px; }

        .card-customer { font-weight: 600; color: var(--text); font-size: 0.8rem; }

        .card-by { display: none; }

        .card-date { font-size: 0.7rem; color: var(--text-muted); }

        /* ── Crown banner ── */
        .crown-banner {
            background: linear-gradient(90deg, #f1c40f, #f39c12);
            color: #1a1000;
            font-size: 0.7rem;
            font-weight: 800;
            text-align: center;
            padding: 6px 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .card.top-voted { box-shadow: 0 4px 20px rgba(241,196,15,0.35), 0 0 0 2px #f1c40f; }

        /* ── Vote button ── */
        .card-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .vote-btn {
            background: none;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 3px 9px;
            font-size: 0.72rem;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            font-family: inherit;
            line-height: 1.4;
        }

        .vote-btn:hover { border-color: #f1c40f; color: #f1c40f; }
        .vote-btn.voted { border-color: #f1c40f; color: #f1c40f; background: rgba(241,196,15,0.1); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            column-span: all;
        }

        .empty-state .empty-emoji { display: none; }
        .empty-state p { font-size: 0.95rem; }

        /* Loading state */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* ── Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
            padding: 0;
        }

        @media (min-width: 600px) {
            .modal-overlay { align-items: center; padding: 20px; }
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px 20px 0 0;
            padding: 28px 24px 32px;
            width: 100%;
            max-width: 520px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        @media (min-width: 600px) {
            .modal { border-radius: 16px; }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin: 0 auto 20px;
        }

        @media (min-width: 600px) { .modal-handle { display: none; } }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
        }

        .modal-close:hover { color: var(--text); }

        .modal h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Form fields */
        .field { margin-bottom: 14px; }

        .field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }

        .field input,
        .field textarea {
            width: 100%;
            padding: 11px 13px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.2s;
        }

        .field textarea { min-height: 90px; resize: vertical; }

        .field input:focus,
        .field textarea:focus { outline: none; border-color: var(--accent); }

        /* Photo upload */
        .photo-upload-area {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }

        .photo-upload-area:hover { border-color: var(--accent); background: var(--surface); }

        .photo-upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
            border: none;
            padding: 0;
        }

        .photo-upload-area input[type="file"]:focus { outline: none; }

        .upload-icon { font-size: 1.6rem; display: block; margin-bottom: 6px; }
        .upload-label { font-size: 0.85rem; color: var(--text-muted); pointer-events: none; }

        .photo-preview {
            margin-top: 10px;
            display: none;
            position: relative;
        }

        .photo-preview img,
        .photo-preview video {
            max-height: 120px;
            border-radius: 8px;
            object-fit: cover;
            width: 100%;
        }

        .photo-preview-remove {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Progress bar */
        .upload-progress {
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
            display: none;
        }

        .upload-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, hsl(220,80%,55%), hsl(270,75%,60%));
            border-radius: 4px;
            width: 0%;
            transition: width 0.2s;
        }

        /* Feedback messages */
        .form-msg {
            border-radius: 8px;
            padding: 10px 13px;
            font-size: 0.88rem;
            margin-bottom: 12px;
            display: none;
        }

        .form-msg.success { background: #d4edda; color: #155724; }
        .form-msg.error   { background: #f8d7da; color: #721c24; }

        [data-theme="dark"] .form-msg.success { background: #1a3a22; color: #86efac; }
        [data-theme="dark"] .form-msg.error   { background: #3a1a1c; color: #fca5a5; }

        .submit-btn {
            width: 100%;
            padding: 13px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 700;
            background: linear-gradient(135deg, hsl(220,80%,55%), hsl(270,75%,60%));
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            letter-spacing: 0.02em;
        }

        .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 0.88rem;
            box-shadow: 0 4px 20px var(--shadow);
            z-index: 500;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
            opacity: 0;
            white-space: nowrap;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* ── Lightbox ── */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 900;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: zoom-out;
        }

        .lightbox.open { display: flex; animation: lbFadeIn 0.2s ease; }

        @keyframes lbFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .lightbox-inner {
            position: relative;
            max-width: 92vw;
            max-height: 88vh;
            cursor: default;
            animation: lbScaleIn 0.2s ease;
        }

        @keyframes lbScaleIn {
            from { transform: scale(0.93); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        .lightbox-inner img {
            display: block;
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }

        .lightbox-inner video {
            display: block;
            max-width: 92vw;
            max-height: 88vh;
            border-radius: 6px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
            background: #000;
        }

        .lightbox-close {
            position: absolute;
            top: -14px;
            right: -14px;
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: background 0.15s;
            line-height: 1;
        }

        .lightbox-close:hover { background: rgba(255,255,255,0.3); }

        /* Klikcursor op media in kaart */
        .card.has-photo .photo-wrap,
        .card.has-video .video-wrap { cursor: zoom-in; }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .hero h1 { font-size: 1.5rem; }
            .topbar { padding: 10px 14px; }
            .page-title { font-size: 0.95rem; }
            .wall { padding: 0 12px 32px; column-gap: 12px; }
            .wall { columns: 1; }
        }

        @media (min-width: 481px) and (max-width: 720px) {
            .wall { columns: 2; }
        }
    </style>
</head>
<body>

    <!-- Top bar -->
    <nav class="topbar">
        <div class="topbar-left">
            <a href="/" class="back-link">← Terug</a>
        </div>
        <div class="topbar-right">
            <a href="/admin/" class="icon-btn" style="text-decoration:none">🔐 Beheer</a>
            <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <span class="hero-emoji">💎</span>
        <h1>Klantparels</h1>
        <p>De mooiste, gekste en onvergetelijkste uitspraken van onze klanten — verzameld door het CS-team.</p>
        <button class="hero-add-btn" onclick="openAddModal()">
            ✨ Quote toevoegen
        </button>
    </section>

    <!-- Filter bar -->
    <div class="filter-bar" id="filter-bar">
        <div class="filter-group">
            <span class="filter-label">Sortering</span>
            <button class="chip active" id="chip-sort-votes"   onclick="setFilter('sort','votes')">⭐ Stemmen</button>
            <button class="chip"        id="chip-sort-newest"  onclick="setFilter('sort','newest')">🕐 Nieuwste</button>
            <button class="chip"        id="chip-sort-oldest"  onclick="setFilter('sort','oldest')">📅 Oudste</button>
        </div>

        <div class="filter-sep"></div>

        <div class="filter-group">
            <span class="filter-label">Type</span>
            <button class="chip active" id="chip-type-all"   onclick="setFilter('type','all')">Alles</button>
            <button class="chip"        id="chip-type-photo" onclick="setFilter('type','photo')">📷 Foto</button>
            <button class="chip"        id="chip-type-video" onclick="setFilter('type','video')">🎬 Video</button>
            <button class="chip"        id="chip-type-text"  onclick="setFilter('type','text')">💬 Tekst</button>
        </div>

        <div class="filter-sep"></div>

        <div class="filter-group">
            <span class="filter-label">Periode</span>
            <button class="chip active" id="chip-period-all"   onclick="setFilter('period','all')">Altijd</button>
            <button class="chip"        id="chip-period-week"  onclick="setFilter('period','week')">Deze week</button>
            <button class="chip"        id="chip-period-month" onclick="setFilter('period','month')">Deze maand</button>
        </div>

        <span class="filter-count" id="filter-count" style="display:none"></span>
    </div>

    <!-- Wall -->
    <main class="wall" id="wall">
        <div class="loading-state">Laden...</div>
    </main>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- ── Lightbox ── -->
    <div class="lightbox" id="lightbox" onclick="onLightboxClick(event)">
        <div class="lightbox-inner" id="lightbox-inner">
            <button class="lightbox-close" onclick="closeLightbox()" title="Sluiten">✕</button>
            <!-- content wordt dynamisch ingevuld -->
        </div>
    </div>

    <!-- ── Add quote modal ── -->
    <div class="modal-overlay" id="add-modal" onclick="closeOnOverlay(event, 'add-modal')">
        <div class="modal">
            <div class="modal-handle"></div>
            <button class="modal-close" onclick="closeModal('add-modal')">✕</button>
            <h2>✨ Quote toevoegen</h2>

            <div class="field">
                <label>Quote <span style="color:#e74c3c">*</span></label>
                <textarea id="input-quote" placeholder="Wat zei de klant?" oninput="clearMsg()"></textarea>
            </div>

            <div class="field">
                <label>Product <span style="color:var(--text-muted);font-weight:400">(optioneel)</span></label>
                <input type="text" id="input-customer" placeholder="bijv. Zwembad liner">
            </div>

            <div class="field">
                <label>Foto of video <span style="color:var(--text-muted);font-weight:400">(optioneel)</span></label>
                <div class="photo-upload-area" id="upload-area">
                    <input type="file" id="input-photo" accept="image/*,video/*" onchange="onMediaSelected(event)">
                    <span class="upload-icon" id="upload-icon">📷</span>
                    <span class="upload-label" id="upload-label">Klik om een foto of video te kiezen</span>
                </div>
                <div class="upload-progress" id="upload-progress">
                    <div class="upload-progress-bar" id="upload-progress-bar"></div>
                </div>
                <div class="photo-preview" id="photo-preview">
                    <img id="photo-preview-img" src="" alt="Preview">
                    <video id="video-preview-el" src="" muted playsinline style="display:none"></video>
                    <button class="photo-preview-remove" onclick="removePhoto()" title="Verwijderen">✕</button>
                </div>
            </div>

            <div class="form-msg" id="form-msg"></div>

            <button class="submit-btn" id="submit-btn" onclick="submitQuote()">Indienen</button>
        </div>
    </div>

    <script>
        // ── Firebase init ──────────────────────────────────────────────────────
        const FIREBASE_CONFIG = {
            apiKey:            "AIzaSyBm136XADZqyBL6wgUMjlNKyTL255DSSFw",
            authDomain:        "dnssec-cs.firebaseapp.com",
            projectId:         "dnssec-cs",
            storageBucket:     "dnssec-cs.firebasestorage.app",
            messagingSenderId: "124601509536",
            appId:             "1:124601509536:web:93a2023a9077cfe235cbc5"
        };

        firebase.initializeApp(FIREBASE_CONFIG);
        const db = firebase.firestore();
        const COLLECTION = 'klantenservice-quotes';

        // ── State ──────────────────────────────────────────────────────────────
        let selectedFile = null;
        let uploadedImageUrl = null;
        let isVideoFile = false;
        let unsubscribe = null;
        let allDocs = [];
        let filterState = { sort: 'votes', type: 'all', period: 'all' };

        // ── Theme ──────────────────────────────────────────────────────────────
        (function initTheme() {
            const saved = localStorage.getItem('theme') || 'dark';
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('theme-toggle').textContent = '☀️ Light';
            }
        })();

        function toggleTheme() {
            const html = document.documentElement;
            const btn  = document.getElementById('theme-toggle');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.textContent = '🌙 Dark';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ Light';
                localStorage.setItem('theme', 'dark');
            }
        }

        // ── Toast ──────────────────────────────────────────────────────────────
        let toastTimer = null;

        function showToast(msg, duration = 3000) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), duration);
        }

        // ── Modal helpers ──────────────────────────────────────────────────────
        function openModal(id) {
            document.getElementById(id).classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
            document.body.style.overflow = '';
        }

        function closeOnOverlay(e, id) {
            if (e.target === document.getElementById(id)) closeModal(id);
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (document.getElementById('lightbox').classList.contains('open')) {
                    closeLightbox();
                } else {
                    closeModal('add-modal');
                }
            }
        });

        // ── Lightbox ───────────────────────────────────────────────────────────
        function openLightbox(url, type) {
            const inner = document.getElementById('lightbox-inner');
            // Verwijder vorige content, maar bewaar de sluitknop
            const closeBtn = inner.querySelector('.lightbox-close');
            inner.innerHTML = '';
            inner.appendChild(closeBtn);

            if (type === 'video') {
                const vid = document.createElement('video');
                vid.src      = url;
                vid.controls = true;
                vid.autoplay = true;
                vid.setAttribute('playsinline', '');
                inner.appendChild(vid);
            } else {
                const img = document.createElement('img');
                img.src = url;
                img.alt = 'Vergroot';
                inner.appendChild(img);
            }

            document.getElementById('lightbox').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lb    = document.getElementById('lightbox');
            const inner = document.getElementById('lightbox-inner');
            lb.classList.remove('open');
            document.body.style.overflow = '';
            // Stop video om audio te stoppen
            const vid = inner.querySelector('video');
            if (vid) { vid.pause(); vid.src = ''; }
        }

        function onLightboxClick(e) {
            // Sluit als er buiten de inner (op de overlay) geklikt wordt
            if (e.target === document.getElementById('lightbox')) closeLightbox();
        }

        // ── Add quote modal ────────────────────────────────────────────────────
        function openAddModal() {
            document.getElementById('input-quote').value = '';
            document.getElementById('input-customer').value = '';
            // Behoud naam van vorige keer
            document.getElementById('input-photo').value = '';
            removePhoto();
            clearMsg();
            const btn = document.getElementById('submit-btn');
            btn.disabled = false;
            btn.textContent = 'Indienen';
            openModal('add-modal');
            setTimeout(() => document.getElementById('input-quote').focus(), 100);
        }

        function clearMsg() {
            document.getElementById('form-msg').style.display = 'none';
        }

        function showFormMsg(text, type) {
            const el = document.getElementById('form-msg');
            el.textContent = text;
            el.className = 'form-msg ' + type;
            el.style.display = 'block';
        }

        // ── Media handling ─────────────────────────────────────────────────────
        function onMediaSelected(e) {
            const file = e.target.files[0];
            if (!file) return;

            const isVideo = file.type.startsWith('video/');
            const maxSize = isVideo ? 50 * 1024 * 1024 : 10 * 1024 * 1024;
            const maxLabel = isVideo ? '50 MB' : '10 MB';

            if (file.size > maxSize) {
                showFormMsg(`Bestand is te groot (max ${maxLabel}).`, 'error');
                return;
            }

            selectedFile = file;
            uploadedImageUrl = null;
            isVideoFile = isVideo;

            const imgEl   = document.getElementById('photo-preview-img');
            const videoEl = document.getElementById('video-preview-el');

            if (isVideo) {
                imgEl.style.display   = 'none';
                imgEl.src             = '';
                videoEl.style.display = 'block';
                videoEl.src           = URL.createObjectURL(file);
                document.getElementById('upload-icon').textContent  = '🎬';
            } else {
                videoEl.style.display = 'none';
                videoEl.src           = '';
                imgEl.style.display   = 'block';
                const reader = new FileReader();
                reader.onload = ev => { imgEl.src = ev.target.result; };
                reader.readAsDataURL(file);
                document.getElementById('upload-icon').textContent  = '📷';
            }

            document.getElementById('photo-preview').style.display = 'block';
            document.getElementById('upload-label').textContent    = file.name;
        }

        function removePhoto() {
            selectedFile      = null;
            uploadedImageUrl  = null;
            isVideoFile       = false;

            document.getElementById('input-photo').value             = '';
            document.getElementById('photo-preview').style.display   = 'none';
            document.getElementById('photo-preview-img').src         = '';
            document.getElementById('photo-preview-img').style.display = 'block';
            const videoEl = document.getElementById('video-preview-el');
            videoEl.src           = '';
            videoEl.style.display = 'none';
            document.getElementById('upload-icon').textContent   = '📷';
            document.getElementById('upload-label').textContent  = 'Klik om een foto of video te kiezen';
            document.getElementById('upload-progress').style.display = 'none';
            document.getElementById('upload-progress-bar').style.width = '0%';
        }

        async function uploadToCloudinary(file) {
            const progressBar  = document.getElementById('upload-progress-bar');
            const progressWrap = document.getElementById('upload-progress');
            progressWrap.style.display = 'block';
            progressBar.style.width = '10%';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CONFIG.cloudinaryUploadPreset);

            // Gebruik resource-type specifieke endpoint zodat het preset geen aanpassing nodig heeft
            const resourceType = file.type.startsWith('video/') ? 'video' : 'image';
            const url = `https://api.cloudinary.com/v1_1/${CONFIG.cloudinaryCloudName}/${resourceType}/upload`;

            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', url);

                xhr.upload.onprogress = e => {
                    if (e.lengthComputable) {
                        progressBar.style.width = Math.round((e.loaded / e.total) * 90) + '%';
                    }
                };

                xhr.onload = () => {
                    progressBar.style.width = '100%';
                    if (xhr.status === 200) {
                        const res = JSON.parse(xhr.responseText);
                        resolve(res.secure_url);
                    } else {
                        reject(new Error('Upload mislukt'));
                    }
                };

                xhr.onerror = () => reject(new Error('Upload mislukt'));
                xhr.send(formData);
            });
        }

        // ── Submit ─────────────────────────────────────────────────────────────
        async function submitQuote() {
            const quote    = document.getElementById('input-quote').value.trim();
            const customer = document.getElementById('input-customer').value.trim();

            if (!quote) { showFormMsg('Vul een quote in.', 'error'); return; }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Bezig…';
            clearMsg();

            try {
                let imageUrl = null;
                if (selectedFile) {
                    btn.textContent = isVideoFile ? 'Video uploaden…' : 'Foto uploaden…';
                    imageUrl = await uploadToCloudinary(selectedFile);
                }

                const doc = {
                    quote,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };
                if (customer)  doc.customerName = customer;
                if (imageUrl) {
                    doc.imageUrl   = imageUrl;
                    doc.mediaType  = isVideoFile ? 'video' : 'image';
                }

                await db.collection(COLLECTION).add(doc);

                btn.textContent = '✓ Verzonden!';
                showFormMsg('Je quote is toegevoegd!', 'success');
                removePhoto();

                setTimeout(() => {
                    closeModal('add-modal');
                    btn.disabled = false;
                    btn.textContent = 'Indienen';
                }, 1800);

            } catch (err) {
                console.error(err);
                showFormMsg('Er ging iets mis. Probeer opnieuw.', 'error');
                btn.disabled = false;
                btn.textContent = 'Indienen';
            }
        }

        // ── Render card ────────────────────────────────────────────────────────
        function formatDate(ts) {
            if (!ts) return '';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function buildCard(id, data, isTop) {
            const card = document.createElement('div');
            const hasMedia  = !!data.imageUrl;
            const isVideo   = data.mediaType === 'video';
            const cardClass = hasMedia ? (isVideo ? 'has-video' : 'has-photo') : 'text-only';
            card.className  = 'card ' + cardClass + (isTop ? ' top-voted' : '');
            card.dataset.id = id;

            const customerHtml = data.customerName
                ? `<span class="card-customer">${escapeHtml(data.customerName)}</span>`
                : '';

            const dateHtml = data.timestamp
                ? `<span class="card-date">${formatDate(data.timestamp)}</span>`
                : '';

            const votes    = data.votes || 0;
            const isVoted  = getMyVote() === id;
            const voteLabel = votes > 0 ? `⭐ ${votes}` : '⭐';
            const voteHtml = `<button class="vote-btn${isVoted ? ' voted' : ''}"
                onclick="voteQuote('${id}')" title="${isVoted ? 'Stem intrekken' : 'Stem op deze quote'}">${voteLabel}</button>`;

            const actionsHtml = `<div class="card-actions">${voteHtml}</div>`;
            const crownHtml   = isTop ? `<div class="crown-banner">🐐 GOAT</div>` : '';

            // Media-blok: klik opent lightbox
            const safeUrl = escapeHtml(data.imageUrl || '');
            let mediaHtml = '';
            if (hasMedia) {
                mediaHtml = isVideo
                    ? `<div class="video-wrap" onclick="openLightbox('${safeUrl}','video')" title="Klik om te vergroten">
                           <video src="${safeUrl}" autoplay muted loop playsinline preload="metadata"></video>
                       </div>`
                    : `<div class="photo-wrap" onclick="openLightbox('${safeUrl}','image')" title="Klik om te vergroten">
                           <img src="${safeUrl}" alt="Quote foto" loading="lazy">
                       </div>`;
            }

            card.innerHTML = `
                ${crownHtml}
                ${mediaHtml}
                <div class="card-body">
                    <p class="card-quote">${escapeHtml(data.quote)}</p>
                    <div class="card-meta">
                        <div class="card-meta-left">
                            ${customerHtml}
                            ${dateHtml}
                        </div>
                        ${actionsHtml}
                    </div>
                </div>`;

            return card;
        }

        // ── Stemmen ────────────────────────────────────────────────────────────
        function getMyVote() {
            return localStorage.getItem('klantparels_vote') || null;
        }

        function saveMyVote(id) {
            if (id) localStorage.setItem('klantparels_vote', id);
            else     localStorage.removeItem('klantparels_vote');
        }

        async function voteQuote(id) {
            const myVote = getMyVote();
            try {
                if (myVote === id) {
                    await db.collection(COLLECTION).doc(id).update({
                        votes: firebase.firestore.FieldValue.increment(-1)
                    });
                    saveMyVote(null);
                } else {
                    if (myVote) {
                        await db.collection(COLLECTION).doc(myVote).update({
                            votes: firebase.firestore.FieldValue.increment(-1)
                        });
                    }
                    await db.collection(COLLECTION).doc(id).update({
                        votes: firebase.firestore.FieldValue.increment(1)
                    });
                    saveMyVote(id);
                }
            } catch (e) {
                console.error('Stem mislukt:', e);
                showToast('Stemmen mislukt, probeer opnieuw.');
            }
        }

        // ── Filters ────────────────────────────────────────────────────────────
        function setFilter(key, val) {
            filterState[key] = val;

            // Activeer de juiste chip in de groep
            document.querySelectorAll(`[id^="chip-${key}-"]`).forEach(btn => {
                btn.classList.toggle('active', btn.id === `chip-${key}-${val}`);
            });

            applyFilters();
        }

        function applyFilters() {
            const wall  = document.getElementById('wall');
            const now   = Date.now();
            const WEEK  = 7  * 24 * 60 * 60 * 1000;
            const MONTH = 30 * 24 * 60 * 60 * 1000;

            // 1 — Periode filteren
            let filtered = allDocs.filter(({ data }) => {
                if (filterState.period !== 'all') {
                    const ms     = data.timestamp ? data.timestamp.toMillis() : 0;
                    const cutoff = now - (filterState.period === 'week' ? WEEK : MONTH);
                    if (ms < cutoff) return false;
                }
                // 2 — Type filteren
                if (filterState.type === 'photo') return !!data.imageUrl && data.mediaType !== 'video';
                if (filterState.type === 'video') return data.mediaType === 'video';
                if (filterState.type === 'text')  return !data.imageUrl;
                return true;
            });

            // 3 — Sorteren
            filtered.sort((a, b) => {
                const ta = a.data.timestamp ? a.data.timestamp.toMillis() : 0;
                const tb = b.data.timestamp ? b.data.timestamp.toMillis() : 0;
                if (filterState.sort === 'newest') return tb - ta;
                if (filterState.sort === 'oldest') return ta - tb;
                // votes: meeste stemmen eerst, dan nieuwste
                const vd = (b.data.votes || 0) - (a.data.votes || 0);
                return vd !== 0 ? vd : tb - ta;
            });

            // 4 — GOAT = altijd de globale stemmen-winnaar over ALLE docs
            //     (niet alleen de gefilterde set, zodat de rand blijft bij filters)
            const globalTop = allDocs.reduce((best, cur) =>
                (cur.data.votes || 0) > (best ? (best.data.votes || 0) : -1) ? cur : best
            , null);
            const topId = globalTop && (globalTop.data.votes || 0) > 0 ? globalTop.id : null;

            // 5 — Teller tonen als er gefilterd wordt
            const countEl = document.getElementById('filter-count');
            const isFiltered = filterState.type !== 'all' || filterState.period !== 'all';
            if (isFiltered && allDocs.length > 0) {
                countEl.textContent = `${filtered.length} van ${allDocs.length}`;
                countEl.style.display = 'inline';
            } else {
                countEl.style.display = 'none';
            }

            // 6 — Wall renderen
            wall.innerHTML = '';
            if (filtered.length === 0) {
                const msg = allDocs.length === 0
                    ? 'Nog geen quotes. Voeg de eerste toe!'
                    : 'Geen quotes gevonden voor deze filters.';
                wall.innerHTML = `<div class="empty-state"><p>${msg}</p></div>`;
                return;
            }

            filtered.forEach(({ id, data }) => {
                wall.appendChild(buildCard(id, data, id === topId));
            });
        }

        // ── Live wall ──────────────────────────────────────────────────────────
        function startWall() {
            const query = db.collection(COLLECTION)
                .orderBy('timestamp', 'desc')
                .limit(200);

            unsubscribe = query.onSnapshot(snapshot => {
                allDocs = [];
                snapshot.forEach(doc => allDocs.push({ id: doc.id, data: doc.data() }));
                applyFilters();
            }, err => {
                console.error(err);
                document.getElementById('wall').innerHTML = `<div class="empty-state">
                    <span class="empty-emoji">⚠️</span>
                    <p>Kon quotes niet laden. Probeer de pagina te vernieuwen.</p>
                </div>`;
            });
        }

        // ── Start ──────────────────────────────────────────────────────────────
        startWall();
    </script>
</body>
</html>
