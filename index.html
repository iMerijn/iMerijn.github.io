<!DOCTYPE html>
<html lang="nl">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6KVMLB0CQ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-6KVMLB0CQ4');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNSSEC?</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --input-bg: #ffffff;
            --input-border: #dddddd;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --input-bg: #2d2d2d;
            --input-border: #444444;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden;
            position: relative;
        }

        #theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: 2px solid var(--input-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            z-index: 10;
        }

        .container {
            text-align: center;
            z-index: 5;
        }

        #lukt-het {
            font-size: 1.2rem;
            color: #888;
            height: 1.5em;
            margin-bottom: 5px;
            font-style: italic;
            visibility: hidden;
        }

        h1 {
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 1.2rem;
            border: 2px solid var(--input-border);
            border-radius: 5px;
            width: 300px;
            margin-bottom: 10px;
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        @keyframes regenboog {
            from { background-position-x: 0; }
            to   { background-position-x: -600px; }
        }

        button#check-btn {
            padding: 10px 20px;
            font-size: 1.2rem;
            background: linear-gradient(90deg,
                hsl(0,   90%, 55%),
                hsl(60,  90%, 52%),
                hsl(120, 80%, 45%),
                hsl(180, 85%, 45%),
                hsl(240, 90%, 60%),
                hsl(300, 90%, 55%),
                hsl(360, 90%, 55%)
            );
            background-size: 600px 100%;
            background-repeat: repeat-x;
            animation: regenboog 10s linear infinite;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
        }

        button#check-btn:hover { filter: brightness(1.15); }

        #status {
            font-size: 10rem;
            font-weight: bold;
            margin: 20px 0;
            min-height: 1.2em;
        }

        .ja { color: #2ecc71; }
        .nee { color: #e74c3c; }
        .laden { color: #bdc3c7; }
        
        #details { font-size: 1.2rem; color: #888; min-height: 1.5em; }

        #troll-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-decoration: none;
            padding: 8px 15px;
            font-size: 0.9rem;
            background-color: #95a5a6;
            color: white;
            border-radius: 5px;
            transition: all 0.1s ease;
            z-index: 1000;
            white-space: nowrap;
        }

        #rocket {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 5rem;
            opacity: 0;
            z-index: 100;
            pointer-events: none;
        }

        @keyframes launch {
            0% { bottom: -100px; opacity: 0; transform: translateX(-50%) scale(1); }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { bottom: 110vh; opacity: 0; transform: translateX(-50%) scale(1.1); }
        }

        .launching { animation: launch 2s ease-in forwards; }
    </style>
</head>
<body>

    <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
    <div id="rocket">🚀</div>

    <div class="container">
        <div id="lukt-het">Lukt het? 🎯</div>
        <h1>Kijk maar ff</h1>
        <input type="text" id="domainInput" placeholder="Vul domein in..." value="">
        <button id="check-btn" onclick="checkDNSSEC()">Yusu?</button>
        <p id="status" class="laden">?</p>
        <p id="details">Check ff dan.</p>
    </div>

    <a href="https://www.sidn.nl/moderne-internetstandaarden/dnssec" 
       target="_blank" 
       id="troll-btn" 
       onmouseover="moveButton(this)" 
       onclick="moveButton(this)">Wat is DNSSEC?</a>

    <script>
        let missCount = 0;

        function toggleTheme() {
            const body = document.documentElement;
            const btn = document.getElementById('theme-toggle');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                btn.textContent = '🌙 Dark Mode';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ Light Mode';
            }
        }

        function moveButton(btn) {
            missCount++;
            
            if (missCount >= 10) {
                document.getElementById('lukt-het').style.visibility = 'visible';
            }

            const padding = 50;
            const maxX = window.innerWidth - btn.offsetWidth - padding;
            const maxY = window.innerHeight - btn.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
            btn.style.bottom = 'auto';
            btn.style.transform = 'none';
        }

        async function checkDNSSEC() {
            const input = document.getElementById('domainInput').value.trim();
            const statusElement = document.getElementById('status');
            const detailsElement = document.getElementById('details');
            const rocket = document.getElementById('rocket');

            if (!input) {
                alert("Vul eerst een domeinnaam in.");
                return;
            }

            statusElement.textContent = "...";
            statusElement.className = "laden";
            detailsElement.textContent = "Bezig met controleren...";
            rocket.classList.remove('launching');

            try {
                const response = await fetch(`https://dns.google/resolve?name=${input}&type=A&do=true`);
                const data = await response.json();

                if (data.AD === true) {
                    statusElement.textContent = 'Ja';
                    statusElement.className = 'ja';
                    detailsElement.textContent = 'Aha, oke.';
                    setTimeout(() => { rocket.classList.add('launching'); }, 300); 
                } else {
                    statusElement.textContent = 'Nee';
                    statusElement.className = 'nee';
                    detailsElement.textContent = 'Aha, oke.';
                }
            } catch (error) {
                statusElement.textContent = '?';
                statusElement.className = 'laden';
                detailsElement.textContent = "Er ging iets mis.";
            }
        }
    </script>
</body>
</html>
