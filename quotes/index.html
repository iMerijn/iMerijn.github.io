<!DOCTYPE html>
<html lang="nl">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6KVMLB0CQ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6KVMLB0CQ4');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes — DNSSEC</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --input-border: #dddddd;
            --vote-active-up: #2ecc71;
            --vote-active-down: #e74c3c;
            --vote-neutral: #bdc3c7;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --input-border: #444444;
            --vote-neutral: #555;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
            box-sizing: border-box;
        }

        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: 2px solid var(--input-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        a.back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            background: none;
            border: 2px solid var(--input-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            text-decoration: none;
        }

        a.back-link:hover { opacity: 0.7; }

        .quote-card {
            max-width: 620px;
            width: 100%;
            text-align: center;
        }

        h1#quote-text {
            font-size: 2.5rem;
            line-height: 1.3;
            margin: 0 0 32px;
            font-weight: bold;
        }

        .vote-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .vote-btn {
            background: none;
            border: 2px solid var(--vote-neutral);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vote-btn:hover { transform: scale(1.12); }

        .vote-btn.active-up   { border-color: var(--vote-active-up);   }
        .vote-btn.active-down { border-color: var(--vote-active-down); }

        #score-display {
            font-size: 1.6rem;
            font-weight: bold;
            min-width: 40px;
            color: var(--text-color);
        }

        #score-display.positive { color: var(--vote-active-up);   }
        #score-display.negative { color: var(--vote-active-down); }

        @keyframes regenboog {
            from { background-position-x: 0; }
            to   { background-position-x: -600px; }
        }

        button#next-btn {
            padding: 10px 24px;
            font-size: 1rem;
            background: linear-gradient(90deg,
                hsl(0,   90%, 55%),
                hsl(60,  90%, 52%),
                hsl(120, 80%, 45%),
                hsl(180, 85%, 45%),
                hsl(240, 90%, 60%),
                hsl(300, 90%, 55%),
                hsl(360, 90%, 55%)
            );
            background-size: 600px 100%;
            background-repeat: repeat-x;
            animation: regenboog 10s linear infinite;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
        }

        button#next-btn:hover { filter: brightness(1.15); }
    </style>
</head>
<body>

    <a href="/" class="back-link">← Terug</a>
    <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>

    <div class="quote-card">
        <h1 id="quote-text">Laden...</h1>

        <div class="vote-row">
            <button class="vote-btn" id="upvote-btn"   onclick="vote(1)"  title="Upvote">🚀</button>
            <span id="score-display">0</span>
            <button class="vote-btn" id="downvote-btn" onclick="vote(-1)" title="Downvote">📉</button>
        </div>

        <button id="next-btn" onclick="showNextQuote()">Volgende quote</button>
    </div>

    <script>
        let quotes = [];
        let currentIndex = -1;

        function quoteKey(text) {
            return text.trim().substring(0, 80);
        }

        function loadVotes() {
            return JSON.parse(localStorage.getItem('quote_votes') || '{}');
        }

        function saveVotes(votes) {
            localStorage.setItem('quote_votes', JSON.stringify(votes));
        }

        function vote(value) {
            const key = quoteKey(quotes[currentIndex]);
            const votes = loadVotes();
            const entry = votes[key] || { score: 0, myVote: 0 };

            if (entry.myVote === value) {
                entry.score  -= value;
                entry.myVote  = 0;
            } else {
                entry.score  -= entry.myVote;
                entry.score  += value;
                entry.myVote  = value;
            }

            votes[key] = entry;
            saveVotes(votes);
            renderVote(entry);
        }

        function renderVote(entry) {
            const scoreEl    = document.getElementById('score-display');
            const upvoteBtn  = document.getElementById('upvote-btn');
            const downvoteBtn = document.getElementById('downvote-btn');

            scoreEl.textContent = entry.score;
            scoreEl.className   = entry.score > 0 ? 'positive' : entry.score < 0 ? 'negative' : '';
            upvoteBtn.className   = 'vote-btn' + (entry.myVote ===  1 ? ' active-up'   : '');
            downvoteBtn.className = 'vote-btn' + (entry.myVote === -1 ? ' active-down' : '');
        }

        async function loadQuotes() {
            const response = await fetch('/quotes/quotes.md');
            const text = await response.text();

            quotes = text
                .split(/\n---\n/)
                .map(block => block.trim())
                .filter(block => block.length > 0)
                .map(block => block.split('\n').map(l => l.trim()).filter(l => l).join(' '))
                .filter(t => t.length > 0);
        }

        function showNextQuote() {
            if (quotes.length === 0) {
                document.getElementById('quote-text').textContent = 'Geen quotes gevonden.';
                return;
            }
            let index;
            do {
                index = Math.floor(Math.random() * quotes.length);
            } while (quotes.length > 1 && index === currentIndex);
            currentIndex = index;

            document.getElementById('quote-text').textContent = quotes[currentIndex];

            const votes = loadVotes();
            renderVote(votes[quoteKey(quotes[currentIndex])] || { score: 0, myVote: 0 });
        }

        function toggleTheme() {
            const body = document.documentElement;
            const btn = document.getElementById('theme-toggle');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                btn.textContent = '🌙 Dark Mode';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ Light Mode';
            }
        }

        loadQuotes().then(showNextQuote).catch(() => {
            document.getElementById('quote-text').textContent = 'Kon quotes niet laden.';
        });
    </script>
</body>
</html>
