<!DOCTYPE html>
<html lang="nl">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6KVMLB0CQ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6KVMLB0CQ4');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes — DNSSEC</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --input-border: #dddddd;
            --vote-active-up: #2ecc71;
            --vote-active-down: #e74c3c;
            --vote-neutral: #bdc3c7;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --input-border: #444444;
            --vote-neutral: #555;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            box-sizing: border-box;
        }

        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: 2px solid var(--input-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        a.back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            background: none;
            border: 2px solid var(--input-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            text-decoration: none;
        }

        a.back-link:hover, #theme-toggle:hover { opacity: 0.7; }

        /* ── Quote + controls ── */
        .quote-area {
            position: fixed;
            top: 60px;
            bottom: 42%;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 32px;
            text-align: center;
            overflow: hidden;
        }

        h1#quote-text {
            font-size: 2.5rem;
            line-height: 1.3;
            margin: 0;
            font-weight: bold;
            max-width: 620px;
        }

        .controls-area {
            position: fixed;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 5;
        }

        .vote-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .vote-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .vote-count {
            font-size: 0.72rem;
            color: #888;
            min-width: 40px;
            text-align: center;
        }

        .vote-btn {
            background: none;
            border: 2px solid var(--vote-neutral);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vote-btn:hover { transform: scale(1.12); }
        .vote-btn.active-up   { border-color: var(--vote-active-up);   }
        .vote-btn.active-down { border-color: var(--vote-active-down); }

        #score-display {
            font-size: 1.6rem;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
            color: var(--text-color);
        }

        #score-display.positive { color: var(--vote-active-up);   }
        #score-display.negative { color: var(--vote-active-down); }

        @keyframes regenboog {
            from { background-position-x: 0; }
            to   { background-position-x: -600px; }
        }

        button#next-btn {
            padding: 10px 24px;
            font-size: 1rem;
            background: linear-gradient(90deg,
                hsl(0,   90%, 55%), hsl(60,  90%, 52%), hsl(120, 80%, 45%),
                hsl(180, 85%, 45%), hsl(240, 90%, 60%), hsl(300, 90%, 55%),
                hsl(360, 90%, 55%)
            );
            background-size: 600px 100%;
            background-repeat: repeat-x;
            animation: regenboog 10s linear infinite;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
        }

        button#next-btn:hover { filter: brightness(1.15); }

        /* ── Bottom buttons ── */
        .bottom-btns {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .bottom-btn {
            background: none;
            border: 2px solid var(--input-border);
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            font-family: inherit;
        }

        .bottom-btn:hover { opacity: 0.7; }

        /* ── Shared modal styles ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--bg-color);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 32px;
            max-width: 520px;
            width: 90%;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin: 0 0 20px;
            font-size: 1.4rem;
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-color);
            line-height: 1;
        }

        /* ── Scoreboard ── */
        .sb-section-title {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #888;
            margin: 20px 0 4px;
        }

        .scoreboard-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--input-border);
        }

        .scoreboard-row:last-child { border-bottom: none; }

        .sb-rank { font-size: 1.1rem; font-weight: bold; min-width: 28px; color: #888; }
        .sb-rank.gold   { color: #f1c40f; }
        .sb-rank.silver { color: #95a5a6; }
        .sb-rank.bronze { color: #cd7f32; }

        .sb-quote { flex: 1; font-size: 0.95rem; line-height: 1.4; }

        .sb-score { font-weight: bold; font-size: 1rem; color: var(--vote-active-up); min-width: 32px; text-align: right; }
        .sb-score.negative { color: var(--vote-active-down); }

        /* ── Add quote modal ── */
        #add-quote-textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            font-size: 1rem;
            font-family: inherit;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        #add-quote-textarea:focus { outline: none; border-color: #888; }

        #duplicate-warning {
            background: #fff8e1;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 0.88rem;
            color: #7a5800;
            display: none;
        }

        [data-theme="dark"] #duplicate-warning {
            background: #332900;
            border-color: #ffc107;
            color: #ffd54f;
        }

        #add-result {
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        #add-result.success { background: #d4edda; color: #155724; }
        #add-result.error   { background: #f8d7da; color: #721c24; }

        [data-theme="dark"] #add-result.success { background: #1a3a22; color: #86efac; }
        [data-theme="dark"] #add-result.error   { background: #3a1a1c; color: #fca5a5; }

        .modal-footer { display: flex; justify-content: flex-end; }

        button#submit-quote-btn {
            padding: 10px 22px;
            font-size: 1rem;
            background: linear-gradient(90deg,
                hsl(0,   90%, 55%), hsl(60,  90%, 52%), hsl(120, 80%, 45%),
                hsl(180, 85%, 45%), hsl(240, 90%, 60%), hsl(300, 90%, 55%),
                hsl(360, 90%, 55%)
            );
            background-size: 600px 100%;
            background-repeat: repeat-x;
            animation: regenboog 10s linear infinite;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
            font-family: inherit;
        }

        button#submit-quote-btn:disabled { opacity: 0.5; cursor: not-allowed; animation: none; background: #aaa; }
    </style>
</head>
<body>

    <a href="/" class="back-link">← Terug</a>
    <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>

    <!-- Bottom buttons -->
    <div class="bottom-btns">
        <button class="bottom-btn" onclick="openScoreboard()">🏆 Scoreboard</button>
        <button class="bottom-btn" onclick="openAddQuote()">📝 Quote toevoegen</button>
    </div>

    <!-- Scoreboard modal -->
    <div id="scoreboard-overlay" class="modal-overlay" onclick="closeScoreboardOnOverlay(event)">
        <div class="modal">
            <button class="modal-close" onclick="closeScoreboard()">✕</button>
            <h2>🏆 Top 5 quotes</h2>
            <div id="scoreboard-content"><div style="text-align:center;color:#888;font-style:italic;padding:16px 0">Laden...</div></div>
        </div>
    </div>

    <!-- Add quote modal -->
    <div id="add-quote-overlay" class="modal-overlay" onclick="closeAddOnOverlay(event)">
        <div class="modal">
            <button class="modal-close" onclick="closeAddQuote()">✕</button>
            <h2>📝 Quote toevoegen</h2>
            <textarea id="add-quote-textarea" placeholder="Typ hier je quote..." oninput="onQuoteInput()"></textarea>
            <div id="duplicate-warning"></div>
            <div id="add-result"></div>
            <div class="modal-footer">
                <button id="submit-quote-btn" onclick="submitQuote()">Indienen</button>
            </div>
        </div>
    </div>

    <div class="quote-area">
        <h1 id="quote-text">Laden...</h1>
    </div>

    <div class="controls-area">
        <div class="vote-row">
            <div class="vote-col">
                <button class="vote-btn" id="upvote-btn" onclick="vote(1)" title="Upvote">🚀</button>
                <span class="vote-count" id="up-count">0</span>
            </div>
            <span id="score-display">–</span>
            <div class="vote-col">
                <button class="vote-btn" id="downvote-btn" onclick="vote(-1)" title="Downvote">📉</button>
                <span class="vote-count" id="down-count">0</span>
            </div>
        </div>
        <button id="next-btn" onclick="showNextQuote()">Volgende quote</button>
    </div>

    <script>
        const FIREBASE_CONFIG = {
            apiKey:            "AIzaSyDeH8CLVTQBedgLrKNU3cvrpjs7J2eAL4o",
            authDomain:        "dnssec-quotes.firebaseapp.com",
            databaseURL:       "https://dnssec-quotes-default-rtdb.europe-west1.firebasedatabase.app",
            projectId:         "dnssec-quotes",
            storageBucket:     "dnssec-quotes.firebasestorage.app",
            messagingSenderId: "40756484574",
            appId:             "1:40756484574:web:95655704564cfac23d654f",
            measurementId:     "G-LJWYY51TGL",
        };

        firebase.initializeApp(FIREBASE_CONFIG);
        const db = firebase.database();

        let quotes = [];
        let currentIndex = -1;
        let currentScoreRef = null;

        // ── Voting ───────────────────────────────────────────────────────────

        function quoteKey(text) {
            return text.trim().substring(0, 60).replace(/[.#$\/\[\]\s]/g, '_');
        }

        function loadMyVotes() { return JSON.parse(localStorage.getItem('my_votes') || '{}'); }
        function saveMyVotes(v) { localStorage.setItem('my_votes', JSON.stringify(v)); }

        function renderScore(score, ups, downs) {
            const el = document.getElementById('score-display');
            el.textContent = score;
            el.className = score > 0 ? 'positive' : score < 0 ? 'negative' : '';
            document.getElementById('up-count').textContent   = ups   > 0 ? ups   : '';
            document.getElementById('down-count').textContent = downs > 0 ? downs : '';
        }

        function renderButtons(myVote) {
            document.getElementById('upvote-btn').className   = 'vote-btn' + (myVote ===  1 ? ' active-up'   : '');
            document.getElementById('downvote-btn').className = 'vote-btn' + (myVote === -1 ? ' active-down' : '');
        }

        function watchScore(key) {
            if (currentScoreRef) currentScoreRef.off();
            currentScoreRef = db.ref('votes/' + key);
            currentScoreRef.on('value', snap => {
                const d = snap.val() || {};
                renderScore(d.total || 0, d.ups || 0, d.downs || 0);
            });
        }

        async function vote(value) {
            const key = quoteKey(quotes[currentIndex]);
            const myVotes = loadMyVotes();
            const prev = (myVotes[key] || {}).myVote || 0;
            const newVote = prev === value ? 0 : value;
            myVotes[key] = { myVote: newVote };
            saveMyVotes(myVotes);
            renderButtons(newVote);

            await db.ref('votes/' + key).transaction(current => {
                const c = current ? { ...current } : {};
                // total altijd via delta — werkt ook met bestaande data zonder ups/downs
                c.total = (c.total || 0) + (newVote - prev);
                // ups/downs los bijhouden (alleen voor nieuwe stemmen)
                if (prev ===  1) c.ups   = Math.max(0, (c.ups   || 0) - 1);
                if (prev === -1) c.downs = Math.max(0, (c.downs || 0) - 1);
                if (newVote ===  1) c.ups   = (c.ups   || 0) + 1;
                if (newVote === -1) c.downs = (c.downs || 0) + 1;
                return c;
            });
        }

        // ── Quotes loader ─────────────────────────────────────────────────────

        async function loadQuotes() {
            const response = await fetch('/quotes/quotes.md');
            const text = await response.text();
            quotes = text
                .split(/\n---\n/)
                .map(b => b.trim()).filter(b => b.length > 0)
                .map(b => b.split('\n').map(l => l.trim()).filter(l => l).join(' '))
                .filter(t => t.length > 0);
        }

        function showNextQuote() {
            if (quotes.length === 0) { document.getElementById('quote-text').textContent = 'Geen quotes gevonden.'; return; }
            let index;
            do { index = Math.floor(Math.random() * quotes.length); }
            while (quotes.length > 1 && index === currentIndex);
            currentIndex = index;
            document.getElementById('quote-text').textContent = quotes[currentIndex];
            const key = quoteKey(quotes[currentIndex]);
            renderButtons((loadMyVotes()[key] || {}).myVote || 0);
            watchScore(key);
        }

        // ── Scoreboard ────────────────────────────────────────────────────────

        function renderRows(items, rankFn) {
            return items.map((item, i) => `
                <div class="scoreboard-row">
                    <span class="sb-rank ${rankFn(i)}">#${i + 1}</span>
                    <span class="sb-quote">${item.text}</span>
                    <span class="sb-score ${item.score < 0 ? 'negative' : ''}">${item.score > 0 ? '+' : ''}${item.score}</span>
                </div>`).join('');
        }

        async function openScoreboard() {
            document.getElementById('scoreboard-overlay').classList.add('open');
            document.getElementById('scoreboard-content').innerHTML = '<div style="text-align:center;color:#888;font-style:italic;padding:16px 0">Laden...</div>';
            const snap = await db.ref('votes').once('value');
            const allVotes = snap.val() || {};
            const scored = quotes.map(q => ({ text: q, score: (allVotes[quoteKey(q)] || {}).total || 0 }));
            const top5    = [...scored].sort((a, b) => b.score - a.score).slice(0, 5);
            const bottom5 = [...scored].sort((a, b) => a.score - b.score).slice(0, 5);
            document.getElementById('scoreboard-content').innerHTML = `
                <div class="sb-section-title">⬆️ Beste quotes</div>
                ${renderRows(top5, i => ['gold','silver','bronze','',''][i])}
                <div class="sb-section-title" style="margin-top:24px">⬇️ Slechtste quotes</div>
                ${renderRows(bottom5, () => '')}`;
        }

        function closeScoreboard() { document.getElementById('scoreboard-overlay').classList.remove('open'); }
        function closeScoreboardOnOverlay(e) { if (e.target === document.getElementById('scoreboard-overlay')) closeScoreboard(); }

        // ── Quote toevoegen ───────────────────────────────────────────────────

        function jaccardSimilarity(a, b) {
            const wordsA = new Set(a.toLowerCase().match(/\w+/g) || []);
            const wordsB = new Set(b.toLowerCase().match(/\w+/g) || []);
            const intersection = [...wordsA].filter(w => wordsB.has(w)).length;
            const union = new Set([...wordsA, ...wordsB]).size;
            return union === 0 ? 0 : intersection / union;
        }

        function findSimilar(text) {
            return quotes.find(q => jaccardSimilarity(text, q) >= 0.5);
        }

        function onQuoteInput() {
            const text = document.getElementById('add-quote-textarea').value.trim();
            const warnEl = document.getElementById('duplicate-warning');
            const similar = text.length > 8 ? findSimilar(text) : null;
            if (similar) {
                warnEl.innerHTML = `⚠️ Er staat al iets vergelijkbaars in de lijst:<br><em>"${similar}"</em>`;
                warnEl.style.display = 'block';
            } else {
                warnEl.style.display = 'none';
            }
        }

        async function submitQuote() {
            const text = document.getElementById('add-quote-textarea').value.trim();
            const resultEl = document.getElementById('add-result');
            const btn = document.getElementById('submit-quote-btn');

            if (!text) return;

            if (findSimilar(text)) {
                resultEl.textContent = 'Pas je quote aan — er staat al iets te vergelijkbaars in de lijst.';
                resultEl.className = 'error';
                resultEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Bezig...';
            resultEl.style.display = 'none';

            try {
                await db.ref('pending_quotes').push({
                    text,
                    submitted_at: Date.now(),
                    status: 'pending',
                });
                resultEl.textContent = '✓ Quote ingediend! Hij wordt beoordeeld voordat hij verschijnt.';
                resultEl.className = 'success';
                resultEl.style.display = 'block';
                document.getElementById('add-quote-textarea').value = '';
                document.getElementById('duplicate-warning').style.display = 'none';
                btn.textContent = 'Verzonden ✓';
            } catch (e) {
                resultEl.textContent = 'Er ging iets mis. Probeer opnieuw.';
                resultEl.className = 'error';
                resultEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Indienen';
            }
        }

        function openAddQuote() {
            document.getElementById('add-quote-overlay').classList.add('open');
            document.getElementById('add-quote-textarea').value = '';
            document.getElementById('duplicate-warning').style.display = 'none';
            document.getElementById('add-result').style.display = 'none';
            const btn = document.getElementById('submit-quote-btn');
            btn.disabled = false;
            btn.textContent = 'Indienen';
        }

        function closeAddQuote() { document.getElementById('add-quote-overlay').classList.remove('open'); }
        function closeAddOnOverlay(e) { if (e.target === document.getElementById('add-quote-overlay')) closeAddQuote(); }

        // ── Theme ─────────────────────────────────────────────────────────────

        function toggleTheme() {
            const body = document.documentElement;
            const btn = document.getElementById('theme-toggle');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                btn.textContent = '🌙 Dark Mode';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ Light Mode';
            }
        }

        loadQuotes().then(showNextQuote).catch(() => {
            document.getElementById('quote-text').textContent = 'Kon quotes niet laden.';
        });
    </script>
</body>
</html>
