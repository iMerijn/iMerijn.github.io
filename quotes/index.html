<!DOCTYPE html>
<html lang="nl">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6KVMLB0CQ4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6KVMLB0CQ4');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes — DNSSEC</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --card-bg: #f9f9f9;
            --card-border: #e0e0e0;
            --input-border: #dddddd;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --card-bg: #2d2d2d;
            --card-border: #444444;
            --input-border: #444444;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
            box-sizing: border-box;
        }

        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: 2px solid var(--input-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        a.back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            background: none;
            border: 2px solid var(--input-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            text-decoration: none;
        }

        a.back-link:hover { opacity: 0.7; }

        .quote-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 40px 48px;
            max-width: 620px;
            width: 100%;
            text-align: center;
        }

        .quote-text {
            font-size: 1.4rem;
            line-height: 1.7;
            margin: 0 0 20px;
        }

        .quote-text::before { content: "\201C"; }
        .quote-text::after  { content: "\201D"; }

        .quote-author {
            font-size: 1rem;
            color: #888;
        }

        .quote-author::before { content: "— "; }

        @keyframes regenboog {
            from { background-position-x: 0; }
            to   { background-position-x: -600px; }
        }

        button#next-btn {
            margin-top: 32px;
            padding: 10px 24px;
            font-size: 1rem;
            background: linear-gradient(90deg,
                hsl(0,   90%, 55%),
                hsl(60,  90%, 52%),
                hsl(120, 80%, 45%),
                hsl(180, 85%, 45%),
                hsl(240, 90%, 60%),
                hsl(300, 90%, 55%),
                hsl(360, 90%, 55%)
            );
            background-size: 600px 100%;
            background-repeat: repeat-x;
            animation: regenboog 10s linear infinite;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-shadow: 0 1px 2px rgba(0,0,0,0.35);
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        button#next-btn:hover { filter: brightness(1.15); }

        #error {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <a href="/" class="back-link">← Terug</a>
    <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>

    <div class="quote-card">
        <p class="quote-text" id="quote-text">Laden...</p>
        <p class="quote-author" id="quote-author"></p>
        <button id="next-btn" onclick="showNextQuote()">Volgende quote</button>
    </div>

    <script>
        let quotes = [];
        let lastIndex = -1;

        async function loadQuotes() {
            const response = await fetch('/quotes/quotes.md');
            const text = await response.text();

            quotes = text
                .split(/\n---\n/)
                .map(block => block.trim())
                .filter(block => block.length > 0)
                .map(block => {
                    const lines = block.split('\n').map(l => l.trim()).filter(l => l);
                    const authorIndex = lines.findIndex(l => l.startsWith('—'));
                    if (authorIndex === -1) return null;
                    const text = lines.slice(0, authorIndex).join(' ');
                    const author = lines[authorIndex].replace(/^—\s*/, '');
                    return { text, author };
                })
                .filter(Boolean);
        }

        function showRandomQuote() {
            if (quotes.length === 0) {
                document.getElementById('quote-text').textContent = 'Geen quotes gevonden.';
                document.getElementById('quote-author').textContent = '';
                return;
            }
            let index;
            do {
                index = Math.floor(Math.random() * quotes.length);
            } while (quotes.length > 1 && index === lastIndex);
            lastIndex = index;
            document.getElementById('quote-text').textContent = quotes[index].text;
            document.getElementById('quote-author').textContent = quotes[index].author;
        }

        function showNextQuote() { showRandomQuote(); }

        function toggleTheme() {
            const body = document.documentElement;
            const btn = document.getElementById('theme-toggle');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                btn.textContent = '🌙 Dark Mode';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ Light Mode';
            }
        }

        loadQuotes().then(showRandomQuote).catch(() => {
            document.getElementById('quote-text').textContent = 'Kon quotes niet laden.';
            document.getElementById('quote-author').textContent = '';
        });
    </script>
</body>
</html>
